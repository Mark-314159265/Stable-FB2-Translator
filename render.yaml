services:
  - type: web
    name: stable-fb2-translator-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PORT
        value: 10000
      - key: GEMINI_MODEL
        value: models/gemini-3.1-flash-lite
